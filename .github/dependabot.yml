version: 2
updates:
  # .NET API & Test Dependencies
  - package-ecosystem: "nuget"
    directories:
      - "/src/FtaaSService.Api"
      - "/tests/FtaaSService.Api.Tests"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # Python Inference Service
  - package-ecosystem: "pip"
    directory: "/src/FtaaSService.Inference"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"
    groups:
      python-inference-dependencies:
        patterns:
          - "*"

  # Python Worker Service
  - package-ecosystem: "pip"
    directory: "/src/FtaaSService.Worker"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"
    groups:
      python-worker-dependencies:
        patterns:
          - "*"

  # Docker Container Images
  - package-ecosystem: "docker"
    directory: "/src/FtaaSService.Api"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"

  - package-ecosystem: "docker"
    directory: "/src/FtaaSService.Worker"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"
    ignore:
      - dependency-name: "python"
        versions: [">= 3.13.0"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "knowthankyew"
    groups:
      github-actions:
        patterns:
          - "*"
