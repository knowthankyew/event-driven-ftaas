name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SHARED_TELEMETRY_REF: v1.0.1

jobs:
  validate-dotnet:
    name: Build & Test .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Shared Privacy Telemetry
        run: git clone --depth 1 --branch "$SHARED_TELEMETRY_REF" https://github.com/knowthankyew/privacy-telemetry.git ../privacy-telemetry

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Dependencies
        run: |
          dotnet restore src/FtaaSService.Api/FtaaSService.Api.csproj
          dotnet restore tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj

      - name: Audit NuGet Vulnerabilities
        run: |
          audit_api=$(dotnet list src/FtaaSService.Api/FtaaSService.Api.csproj package --vulnerable --include-transitive | tee /dev/stderr)
          audit_tests=$(dotnet list tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj package --vulnerable --include-transitive | tee /dev/stderr)
          if echo "$audit_api $audit_tests" | grep -Ei "has the following vulnerable packages|severity: (critical|high|moderate|low)"; then
            echo "Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Run .NET Unit Tests
        run: dotnet test tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj --no-restore

  validate-python:
    name: Test Python Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/FtaaSService.Inference/requirements.txt
          pip install -r src/FtaaSService.Worker/requirements.txt
          pip install -r src/surprisal-service/requirements.txt
          pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit -r src/FtaaSService.Inference/requirements.txt
          pip-audit -r src/FtaaSService.Worker/requirements.txt
          pip-audit -r src/surprisal-service/requirements.txt

      - name: Run Python Unit & Cross-Service Contract Tests
        run: python -m unittest discover -s tests

      - name: Execute Claims, Empirical Benchmarks & Governance Gate
        run: |
          python scripts/audit-claims.py

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@10.9.3 -o bom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-ftaas-cyclonedx
          path: bom.json

  e2e-pipeline:
    name: End-to-End Pipeline & Integration
    runs-on: ubuntu-latest
    needs: [validate-dotnet, validate-python]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Shared Privacy Telemetry
        run: git clone --depth 1 --branch "$SHARED_TELEMETRY_REF" https://github.com/knowthankyew/privacy-telemetry.git ../privacy-telemetry

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/FtaaSService.Inference/requirements.txt
          pip install -r src/FtaaSService.Worker/requirements.txt

      - name: Start Docker Infrastructure
        run: |
          docker compose up -d broker mlflow
          healthy=0
          for i in {1..30}; do
            if docker exec ftaas-rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1 && curl -s -f http://localhost:5001/health >/dev/null 2>&1; then
              echo "Broker and MLflow are healthy"
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Broker or MLflow failed health checks after 30 attempts."
            exit 1
          fi

      - name: Run E2E Verification
        run: |
          chmod +x scripts/verify-e2e.sh
          PYTHON_BIN=python ./scripts/verify-e2e.sh

      - name: Teardown Infrastructure
        if: always()
        run: docker compose down -v

