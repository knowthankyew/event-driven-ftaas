name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-dotnet:
    name: Build & Test .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Shared Privacy Telemetry
        run: git clone --depth 1 https://github.com/knowthankyew/privacy-telemetry.git ../privacy-telemetry

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Dependencies
        run: |
          dotnet restore src/FtaaSService.Api/FtaaSService.Api.csproj
          dotnet restore tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj

      - name: Audit NuGet Vulnerabilities
        run: |
          dotnet list src/FtaaSService.Api/FtaaSService.Api.csproj package --vulnerable --include-transitive
          dotnet list tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj package --vulnerable --include-transitive

      - name: Run .NET Unit Tests
        run: dotnet test tests/FtaaSService.Api.Tests/FtaaSService.Api.Tests.csproj --no-restore

  validate-python:
    name: Test Python Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/FtaaSService.Inference/requirements.txt
          pip install -r src/FtaaSService.Worker/requirements.txt
          pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit -r src/FtaaSService.Inference/requirements.txt
          pip-audit -r src/FtaaSService.Worker/requirements.txt

      - name: Run Python Unit Tests
        run: python -m unittest discover -s tests

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ftaas-cyclonedx
          path: bom.json
